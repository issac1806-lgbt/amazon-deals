
name: Daily Amazon Deals Update

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 時間午夜執行
  workflow_dispatch: # 允許手動觸發

jobs:
  update-deals:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -U google-generativeai requests

    - name: Run deal update script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        APIFREELLM_KEY: ${{ secrets.APIFREELLM_KEY }}
      run: python auto_income_bot_v4.py

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git commit -m "自動更新 Amazon 折扣資訊" || echo "No changes to commit"
        git push
